<style>
  .grow {
    flex-grow: 1;
  }
</style>

<div style="display: flex; flex-direction: column; height: 100%;">
  <header class="homey-header">
    <h1 class="homey-title">Enter IP Address</h1>
    <p class="homey-subtitle">Manually enter the IP address of your device.</p>
  </header>
  <p>
    <label
      for="ip_address"
      class="homey-form-label"
    >IP Address</label>
    <input
      type="text"
      id="ip_address"
      name="ip_address"
      placeholder="192.168.1.2"
      class="homey-form-input"
    >
  </p>
  <span class="grow"></span>
  <p>
    <button
      id="connect"
      class="homey-button-primary-shadow-full"
    >Connect</button>
  </p>
</div>

<script type="text/javascript">
  const $connect = document.getElementById('connect');

  $connect.addEventListener('click', function () {
    $connect.classList.add('is-disabled');
    $connect.classList.add('is-loading');

    Promise.resolve().then(async () => {
      const ip_address = document.getElementById('ip_address').value;

      await Homey.emit('verify_ip', {
        ip_address: ip_address
      });

      await Homey.setViewStoreValue('add_devices', 'devices', [{
        name: `Fully Remote Kiosk at ${ip_address}`,
        data: {
          id: uuidv4(),
        },
        settings: {
          ip_address,
        },
      }]);

      Homey.showView('enter_password');
    })
      .catch(err => Homey.alert(err))
      .finally(() => {
        $connect.classList.remove('is-disabled');
        $connect.classList.remove('is-loading');
      });
  });

  function uuidv4() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
</script>
